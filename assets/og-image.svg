<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="5%" r="65%">
      <stop offset="0%" stop-color="#2B3978" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0c0c14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="78%" cy="92%" r="48%">
      <stop offset="0%" stop-color="#6F0080" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0c0c14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="18%" cy="72%" r="38%">
      <stop offset="0%" stop-color="#2B3978" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0c0c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eeedf2"/>
      <stop offset="38%" stop-color="#eeedf2"/>
      <stop offset="100%" stop-color="#9b30b0"/>
    </linearGradient>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="turbulence"/>
      <feColorMatrix type="saturate" values="0" in="turbulence" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="overlay"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="#0c0c14"/>

  <!-- Glow layers -->
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <!-- Subtle noise texture -->
  <rect width="1200" height="630" fill="#0c0c14" opacity="0.03" filter="url(#noise)"/>

  <!-- Top border accent -->
  <rect x="480" y="0" width="240" height="1" fill="#9b30b0" opacity="0.4"/>

  <!-- HARD2BEAT PRESENTS -->
  <text x="600" y="152"
    font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="13" font-weight="700" letter-spacing="7"
    text-anchor="middle" fill="#8a8898">HARD2BEAT PRESENTS</text>

  <!-- THE MOAT — main title -->
  <text x="600" y="378"
    font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="190" font-weight="900" letter-spacing="-7"
    text-anchor="middle" fill="url(#titleGrad)">THE MOAT</text>

  <!-- Tagline -->
  <text x="600" y="444"
    font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="21" font-weight="600"
    text-anchor="middle" fill="#eeedf2">All you need to know about deep tech in Poland. In one day.</text>

  <!-- Separator -->
  <rect x="516" y="472" width="168" height="1" fill="#252540"/>

  <!-- Event details -->
  <text x="600" y="506"
    font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="13" font-weight="500" letter-spacing="2.5"
    text-anchor="middle" fill="#6b6b88">23 SEPTEMBER 2026  ·  WARSAW, POLAND  ·  INVITATION ONLY</text>

  <!-- Bottom branding -->
  <text x="60" y="598"
    font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="11" font-weight="700" letter-spacing="3"
    text-anchor="start" fill="#2e2e4a">HARD2BEAT.VC</text>

  <text x="1140" y="598"
    font-family="'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="11" font-weight="700" letter-spacing="3"
    text-anchor="end" fill="#2e2e4a">THEMOAT.HARD2BEAT.VC</text>
</svg>
